<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | SMARTS</title>
    <!-- Import Google Fonts: Urbanist & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Urbanist:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", "Urbanist", sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            width: 1100px;
            max-width: 100%;
            height: 85vh;
            max-height: 680px;
            display: grid;
            grid-template-columns: 50% 50%;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(3, 4, 94, 0.12);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LEFT VISUAL PANEL - FULL BACKGROUND IMAGE */
        .left {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            overflow: hidden;
            background: #03045e;
        }

        /* LOCAL BACKGROUND IMAGE */
        .left-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* DARK GRADIENT OVERLAY FOR TEXT READABILITY */
        .left-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(3, 4, 94, 0.85) 0%, rgba(3, 4, 94, 0.4) 50%, rgba(3, 4, 94, 0.9) 100%);
            z-index: 2;
        }

        /* TEXT CONTENT OVERLAY */
        .left-header {
            position: relative;
            z-index: 3;
            color: #ffffff;
        }

        .left-header h1 {
            font-family: "Urbanist", sans-serif;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .left-header p {
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 300;
            line-height: 1.5;
        }

        .left-caption {
            position: relative;
            z-index: 3;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px 20px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.5;
        }

        /* RIGHT FORM PANEL */
        .right {
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            overflow-y: auto;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
        }

        .login-box h2 {
            font-family: "Urbanist", sans-serif;
            font-size: 26px;
            color: #03045e;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1e293b;
        }

        .input-group input {
            width: 100%;
            height: 46px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 14px;
            color: #03045e;
            transition: 0.25s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #03045e;
            box-shadow: 0 0 0 3px rgba(3, 4, 94, 0.1);
        }

        .login-btn {
            width: 100%;
            height: 48px;
            background: #03045e;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(3, 4, 94, 0.2);
            margin-top: 6px;
        }

        .login-btn:hover {
            background: #023e8a;
            box-shadow: 0 6px 16px rgba(3, 4, 94, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #64748b;
        }

        .back-link a {
            color: #03045e;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .message {
            color: #dc2626;
            text-align: center;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }

        @media(max-width: 900px) {
            body { height: auto; overflow-y: auto; }
            .container { grid-template-columns: 1fr; height: auto; max-height: none; }
            .left { display: none; }
            .right { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- LEFT PANEL: YOUR LOCAL PHOTO AS BACKGROUND -->
    <section class="left">
        <!-- Your local image file reference -->
        <img class="left-bg-img" src="student-placement-hero.jpg" alt="Student Career Success">

        <!-- Gradient Overlay -->
        <div class="left-overlay"></div>

        <!-- Top Header Text -->
        <div class="left-header">
            <h1>Student Portal</h1>
            <p>Your centralized gateway to career success and AI-driven skill growth.</p>
        </div>

        <!-- Bottom Caption Box -->
        <div class="left-caption">
            ✨ Access corporate placement drives, take AI skill assessments, and bridge your professional skill gaps seamlessly.
        </div>
    </section>

    <!-- RIGHT LOGIN FORM PANEL -->
    <section class="right">
        <div class="login-box">
            <h2>Student Sign In</h2>
            <p class="subtitle">Enter your institutional credentials to proceed</p>

            <form id="studentLoginForm">
                <div class="input-group">
                    <label>Student Email</label>
                    <input type="email" id="email" required placeholder="student@avinuty.ac.in" autocomplete="username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password">
                </div>

                <button type="submit" class="login-btn">Login to Dashboard</button>

                <div class="back-link">
                    <a href="index.html">&larr; Back to Portal Hub</a>
                </div>

                <div id="message" class="message"></div>
            </form>
        </div>
    </section>
</div>

<script>
    document.getElementById("studentLoginForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const message = document.getElementById("message");
        const loginBtn = document.querySelector(".login-btn");

        message.textContent = "";
        loginBtn.disabled = true;
        loginBtn.textContent = "Authenticating...";

        try {
            const res = await fetch("/api/students1/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                sessionStorage.setItem("studentEmail", email);
                if (data.name) sessionStorage.setItem("studentName", data.name);
                if (data.registerNumber) sessionStorage.setItem("registerNumber", data.registerNumber);
                window.location.href = data.nextPage || "student-dashboard.html";
            } else {
                message.textContent = data.message || "Invalid credentials.";
            }
        } catch (err) {
            message.textContent = "Unable to connect to server.";
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = "Login to Dashboard";
        }
    });
</script>

</body>
</html>
