
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assessments | Skill Mapping</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #0f172a;
            min-height: 100vh;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {

            height: 72px;

            background: white;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            padding: 0 28px;

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 100;
        }

        .menu {

            width: 42px;
            height: 42px;

            border: none;

            background: transparent;

            border-radius: 10px;

            cursor: pointer;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 5px;
        }

        .menu:hover {
            background: #f1f5f9;
        }

        .menu span {

            width: 21px;

            height: 2px;

            background: #334155;

            border-radius: 3px;
        }

        .brand {

            margin-left: 15px;

            font-size: 18px;

            font-weight: 600;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {

            max-width: 1100px;

            margin: auto;

            padding: 115px 40px 40px;
        }

        h1 {

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #64748b;

            margin-bottom: 30px;

            font-size: 15px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 50px 25px;

            text-align: center;

            color: #64748b;

            font-size: 15px;
        }

        .loading-spinner {

            width: 35px;

            height: 35px;

            border: 4px solid #dbeafe;

            border-top-color: #2563eb;

            border-radius: 50%;

            margin: 0 auto 15px;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        /* =========================
           ASSESSMENT CARD
        ========================= */

        .assessment-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 18px;

            transition: 0.2s;
        }

        .assessment-card:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(15, 23, 42, 0.06);
        }

        .assessment-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 10px;
        }

        .assessment-card h2 {

            font-size: 19px;

            margin-bottom: 7px;
        }

        .company {

            color: #2563eb;

            font-size: 13px;

            font-weight: 600;
        }

        .assessment-description {

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 18px;
        }

        /* =========================
           META
        ========================= */

        .meta {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 20px;
        }

        .meta-item {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 8px;

            padding: 7px 11px;

            font-size: 12px;

            color: #475569;
        }

        .category {

            background: #eff6ff;

            color: #2563eb;

            border-color: #bfdbfe;
        }

        /* =========================
           ACTION ROW
        ========================= */

        .action-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .status {

            font-size: 13px;

            font-weight: 600;

            color: #64748b;
        }

        .status.submitted {

            color: #16a34a;
        }

        .start {

            border: none;

            background: #2563eb;

            color: white;

            padding: 11px 22px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;
        }

        .start:hover {

            background: #1d4ed8;
        }

        .start:disabled {

            background: #94a3b8;

            cursor: not-allowed;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 55px 25px;

            text-align: center;
        }

        .empty-icon {

            width: 60px;

            height: 60px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #eff6ff;

            color: #2563eb;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;
        }

        .empty h2 {

            font-size: 18px;

            margin-bottom: 7px;
        }

        .empty p {

            color: #64748b;

            font-size: 14px;
        }

        /* =========================
           ERROR
        ========================= */

        .error-box {

            background: #fff;

            border: 1px solid #fecaca;

            border-radius: 15px;

            padding: 45px 25px;

            text-align: center;
        }

        .error-icon {

            width: 60px;

            height: 60px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #fef2f2;

            color: #dc2626;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;
        }

        .error-box h2 {

            font-size: 18px;

            margin-bottom: 8px;

            color: #991b1b;
        }

        .error-box p {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 20px;
        }

        .retry-btn {

            border: none;

            background: #2563eb;

            color: white;

            padding: 10px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;
        }

        .retry-btn:hover {

            background: #1d4ed8;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 700px) {

            .content {

                padding-left: 20px;

                padding-right: 20px;
            }

            .assessment-header {

                flex-direction: column;
            }

            .action-row {

                flex-direction: column;

                align-items: stretch;
            }

            .start {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     TOPBAR
========================= -->

<header class="topbar">

    <button
            class="menu"
            onclick="goDashboard()">

        <span></span>
        <span></span>
        <span></span>

    </button>


    <div class="brand">

        Skill Mapping

    </div>

</header>


<!-- =========================
     CONTENT
========================= -->

<main class="content">

    <h1>
        Assessments
    </h1>

    <p class="subtitle">
        Complete assessments assigned by employers to evaluate your skills.
    </p>


    <!-- =========================
         ASSESSMENTS
    ========================= -->

    <div id="assessmentList">

        <div class="loading">

            <div class="loading-spinner"></div>

            Loading assessments...

        </div>

    </div>

</main>


<script>


    /* =====================================================
       BACKEND API
    ===================================================== */

    const API_BASE_URL =
        "http://localhost:8080/api/assessments";


    /* =====================================================
       STORAGE KEY
       Only submissions may remain locally if needed.
    ===================================================== */

    const SUBMISSION_KEY =
        "smarts_submissions";


    /* =====================================================
       GET CURRENT STUDENT
    ===================================================== */

    function getStudent() {

        const registerNumber =
            sessionStorage.getItem("registerNumber");

        const name =
            sessionStorage.getItem("studentName");

        return {

            registerNumber:
                registerNumber || "unknown-student",

            name:
                name || "Student"

        };

    }


    /* =====================================================
       GET LOCAL SUBMISSIONS
       This is kept only for compatibility with your
       existing student-side submission status.
    ===================================================== */

    function getSubmissions() {

        const stored =
            localStorage.getItem(
                SUBMISSION_KEY
            );

        if (!stored) {

            return [];

        }

        try {

            const submissions =
                JSON.parse(stored);

            return Array.isArray(submissions)
                ? submissions
                : [];

        } catch (error) {

            console.error(
                "Unable to read submissions:",
                error
            );

            return [];

        }

    }


    /* =====================================================
       CHECK WHETHER STUDENT SUBMITTED
    ===================================================== */

    function hasSubmitted(assessmentId) {

        const student =
            getStudent();

        const submissions =
            getSubmissions();

        return submissions.some(
            submission =>

                String(
                    submission.assessmentId
                ) ===
                String(assessmentId)

                &&

                String(
                    submission.registerNumber
                ) ===
                String(
                    student.registerNumber
                )
        );

    }


    /* =====================================================
       LOAD PUBLISHED ASSESSMENTS
       FROM SPRING BOOT
    ===================================================== */

    async function loadAssessments() {

        const container =
            document.getElementById(
                "assessmentList"
            );


        /*
         * Show loading state
         */

        container.innerHTML = `

            <div class="loading">

                <div class="loading-spinner"></div>

                Loading assessments...

            </div>

        `;


        try {

            console.log(
                "Fetching published assessments..."
            );


            /*
             * IMPORTANT:
             *
             * This is now coming from
             * Spring Boot + MySQL.
             *
             * NOT localStorage.
             */

            const response =
                await fetch(
                    API_BASE_URL + "/published"
                );


            console.log(
                "Assessment API status:",
                response.status
            );


            if (!response.ok) {

                throw new Error(
                    "Unable to load assessments. Server returned " +
                    response.status
                );

            }


            const assessments =
                await response.json();


            console.log(
                "Published assessments from backend:",
                assessments
            );


            /*
             * Safety check
             */

            if (!Array.isArray(assessments)) {

                throw new Error(
                    "Invalid assessment data received from server."
                );

            }


            /*
             * Backend already returns only
             * Published assessments.
             *
             * But we keep this filter as
             * an extra safety check.
             */

            const published =
                assessments.filter(
                    assessment =>

                        !assessment.status ||

                        String(
                            assessment.status
                        ).toLowerCase() ===
                        "published"
                );


            /*
             * No assessments
             */

            if (published.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ✓
                        </div>

                        <h2>
                            No assessments available
                        </h2>

                        <p>
                            Assessments assigned by employers
                            will appear here.
                        </p>

                    </div>

                `;

                return;

            }


            /*
             * Clear loading
             */

            container.innerHTML = "";


            /*
             * Create assessment cards
             */

            published.forEach(
                assessment => {

                    const submitted =
                        hasSubmitted(
                            assessment.id
                        );


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "assessment-card";


                    /*
                     * IMPORTANT:
                     *
                     * Your backend returns:
                     *
                     * companyName
                     *
                     * NOT:
                     *
                     * company
                     */

                    const companyName =
                        assessment.companyName ||
                        assessment.company ||
                        "Employer";


                    card.innerHTML = `

                        <div class="assessment-header">

                            <div>

                                <h2>
                                    ${escapeHTML(
                                        assessment.title
                                    )}
                                </h2>

                                <div class="company">

                                    Posted by:
                                    ${escapeHTML(
                                        companyName
                                    )}

                                </div>

                            </div>

                        </div>


                        <p class="assessment-description">

                            ${escapeHTML(
                                assessment.description ||
                                "No description provided."
                            )}

                        </p>


                        <div class="meta">

                            <div class="meta-item category">

                                ${escapeHTML(
                                    assessment.category ||
                                    "General"
                                )}

                            </div>


                            <div class="meta-item">

                                ${assessment.questionCount || 0}
                                Questions

                            </div>


                            <div class="meta-item">

                                ${assessment.totalMarks || 0}
                                Marks

                            </div>


                            <div class="meta-item">

                                ${assessment.duration || 0}
                                Minutes

                            </div>

                        </div>


                        <div class="action-row">

                            <div class="
                                status
                                ${submitted ? "submitted" : ""}
                            ">

                                ${
                                    submitted
                                    ? "✓ Assessment Submitted"
                                    : "Not Attempted"
                                }

                            </div>


                            <button
                                class="start"
                                ${
                                    submitted
                                    ? "disabled"
                                    : ""
                                }
                                onclick="
                                    startAssessment(
                                        '${assessment.id}'
                                    )
                                "
                            >

                                ${
                                    submitted
                                    ? "Submitted"
                                    : "Start Assessment"
                                }

                            </button>

                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(
                "Assessment loading error:",
                error
            );


            container.innerHTML = `

                <div class="error-box">

                    <div class="error-icon">
                        !
                    </div>

                    <h2>
                        Unable to load assessments
                    </h2>

                    <p>
                        Please make sure the Spring Boot
                        server is running and try again.
                    </p>

                    <button
                        class="retry-btn"
                        onclick="loadAssessments()">

                        Try Again

                    </button>

                </div>

            `;

        }

    }


    /* =====================================================
       START ASSESSMENT
    ===================================================== */

    function startAssessment(
        assessmentId
    ) {

        console.log(
            "Opening assessment:",
            assessmentId
        );


        /*
         * Make sure we received a real
         * database ID.
         */

        if (!assessmentId) {

            alert(
                "Assessment ID is missing."
            );

            return;

        }


        /*
         * IMPORTANT:
         *
         * We no longer search localStorage.
         *
         * The ID comes directly from:
         *
         * GET /api/assessments/published
         *
         * and is passed to the
         * assessment-taking page.
         */

        window.location.href =
            "./take-assessment.html?id=" +
            encodeURIComponent(
                assessmentId
            );

    }


    /* =====================================================
       HTML ESCAPE
    ===================================================== */

    function escapeHTML(
        value
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value == null
                ? ""
                : String(value);


        return div.innerHTML;

    }


    /* =====================================================
       DASHBOARD
    ===================================================== */

    function goDashboard() {

        window.location.href =
            "student-dashboard.html";

    }


    /* =====================================================
       PAGE LOAD
    ===================================================== */

    window.addEventListener(
        "DOMContentLoaded",
        loadAssessments
    );


</script>


</body>

</html>
